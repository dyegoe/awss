version: "2"
linters:
  default: none
  enable:
    - bodyclose
    - copyloopvar
    - depguard
    - dogsled
    - dupl
    - errcheck
    - errorlint
    - forbidigo
    - funlen
    - gochecknoinits
    - goconst
    - gocritic
    - gocyclo
    - goprintffuncname
    - gosec
    - govet
    - ineffassign
    - lll
    - misspell
    - mnd
    - nakedret
    - nilerr
    - noctx
    - nolintlint
    - predeclared
    - revive
    - staticcheck
    - thelper
    - unconvert
    - unparam
    - unused
    - whitespace
    - wrapcheck
  settings:
    depguard:
      rules:
        main:
          allow:
            - $gostd
            - github.com/dyegoe/awss/
            - github.com/spf13/cobra
            - github.com/spf13/viper
            - github.com/aws/aws-sdk-go-v2/
            - github.com/aws/smithy-go
            - github.com/jedib0t/go-pretty/v6/table
            - github.com/jedib0t/go-pretty/v6/text
            - golang.org/x/term
            - gopkg.in/ini.v1
    dupl:
      threshold: 100
    forbidigo:
      forbid:
        - pattern: ^context\.TODO$
          msg: pass the caller's ctx, or context.Background() at the top of search.Execute (AGENTS.md)
      analyze-types: true
    nolintlint:
      require-explanation: true
      require-specific: true
    wrapcheck:
      # The module's own packages return errors that already carry their context, and many are
      # the exact user-facing message (invalid sort field: ...). Only foreign errors need wrapping.
      ignore-package-globs:
        - github.com/dyegoe/awss/*
    funlen:
      lines: 60
      statements: 50
    goconst:
      min-len: 2
      min-occurrences: 3
    gocritic:
      disabled-checks:
        - dupImport
        - ifElseChain
        - octalLiteral
        - whyNoLint
      enabled-tags:
        - diagnostic
        - experimental
        - opinionated
        - performance
        - style
    gocyclo:
      min-complexity: 15
    mnd:
      checks:
        - argument
        - case
        - condition
        - return
      ignored-numbers:
        - "0"
        - "1"
        - "2"
        - "3"
  exclusions:
    generated: lax
    presets:
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - path: _test\.go
        linters:
          - goconst
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/dyegoe/awss
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
