name: PR title
on:
  pull_request:
    branches:
      - main
    # edited: a title change reruns this check without rerunning the Common workflow.
    types: [opened, edited, synchronize, reopened]
jobs:
  # Pull requests are squash-merged, so the title becomes the commit on main that
  # release-please reads. check-commits checks the branch commits, not the title.
  check-title:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout commit
        uses: actions/checkout@v4

      # The same commitizen version as the commit-msg hook in .pre-commit-config.yaml.
      - name: Install commitizen
        run: pip install commitizen==4.18.0

      # The title goes through the environment, never into the script text.
      - name: Check the title follows Conventional Commits
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: cz check --message "$TITLE"
