name: Release
on:
  release:
    types:
      - published

# GoReleaser attaches the binaries and checksums to the release that release-please created.
permissions:
  contents: write

jobs:
  goreleaser:
    name: Release binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          # GoReleaser reads the tags.
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"

      # .goreleaser.yaml: the platforms, the archive names, the checksums file. Keep the version
      # in step with the check-release-config job of common.yml.
      - name: Build and attach the binaries
        uses: goreleaser/goreleaser-action@v7
        with:
          version: v2.18.3
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
