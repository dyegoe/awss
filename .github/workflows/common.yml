name: Common
on:
  pull_request:
    branches:
      - main
jobs:
  check-pull-request:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout commit
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"

      - name: Run fmt
        run: go fmt ./...

      - name: Run vet
        run: go vet ./...

      - name: Run mod tidy
        run: go mod tidy -v

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.13.1

      # -race replaces a plain run: same tests, plus a check of the parallel profile x region
      # fan-out. The detector slows tests down, hence the longer timeout.
      # -shuffle=on catches tests that depend on the order they run in, -count=2 tests that break
      # their own process state (AGENTS.md). A failure prints the seed: rerun with -shuffle=<seed>.
      - name: Run test (race detector, random order, twice)
        run: go test -race -count=2 -shuffle=on -timeout 2m -short $(go list ./...)

      - name: Smoke test version injection
        run: |
          go build -ldflags="-X github.com/dyegoe/awss/cmd.version=ci-test" -o awss .
          ./awss --version | grep -q "ci-test"

  check-commits:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check commit messages follow Conventional Commits
        uses: commitizen-tools/commitizen-action@0.27.1
        with:
          check: true
          push: false
