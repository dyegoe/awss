name: Common
on:
  pull_request:
    branches:
      - main
jobs:
  check-pull-request:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout commit
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"

      - name: Run fmt
        run: go fmt ./...

      - name: Run vet
        run: go vet ./...

      # go mod tidy rewrites go.mod and go.sum; the diff makes an untidy module fail the job.
      - name: Check go.mod and go.sum are tidy
        run: go mod tidy -v && git diff --exit-code -- go.mod go.sum

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.14.0

      # make test is the one test command (Makefile): race detector, random order and every test
      # twice (a failure prints the seed: rerun with -shuffle=<seed>), then a check that every
      # package has tests and covers at least 80% of its statements (AGENTS.md).
      - name: Run test (race, random order, twice, coverage)
        run: make test

      - name: Smoke test version injection
        run: |
          go build -ldflags="-X github.com/dyegoe/awss/cmd.version=ci-test" -o awss .
          ./awss --version | grep -q "ci-test"

  # A broken .goreleaser.yaml fails the pull request, not the release.
  check-release-config:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout commit
        uses: actions/checkout@v4
        with:
          # GoReleaser names the archives after the last tag.
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"

      # Keep the version in step with release.yml.
      - name: Check the GoReleaser config
        uses: goreleaser/goreleaser-action@v7
        with:
          version: v2.18.3
          args: check

      - name: Build a snapshot release
        uses: goreleaser/goreleaser-action@v7
        with:
          version: v2.18.3
          args: release --snapshot --clean

      # The README install steps rely on these names and on the sha256sum -c format.
      - name: Check the archive names and the checksums
        working-directory: dist
        run: |
          tag=$(git describe --tags --abbrev=0)
          missing=0
          for platform in linux-amd64 linux-arm64 darwin-amd64 darwin-arm64; do
            archive="awss-${tag}-${platform}.tar.gz"
            if [ ! -f "$archive" ]; then
              echo "::error::missing release archive $archive"
              missing=1
            fi
          done
          sha256sum -c "awss-${tag}-checksums.txt"
          exit "$missing"

  check-commits:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check commit messages follow Conventional Commits
        uses: commitizen-tools/commitizen-action@0.27.1
        with:
          check: true
          push: false
